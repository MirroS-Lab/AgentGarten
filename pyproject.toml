[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wm"
dynamic = ["version"]
description = "Training framework for controllable video world models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "wm/kernels/attention_jvp/LICENSE-*.txt", "wm/codecs/_taehv/LICENSE"]
dependencies = [
  "attrs>=23.1",
  "einops>=0.7",
  "hydra-core>=1.3",
  "loguru>=0.7",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "python-dotenv>=1.0",
  "PyYAML>=6",
  "safetensors>=0.5",
  "torch>=2.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["torchcodec>=0.8", "transformers>=4.57"]
media = ["imageio>=2.34", "imageio-ffmpeg>=0.5", "Pillow>=10"]
wandb = ["wandb>=0.19"]
te = ["transformer-engine[pytorch]>=2.4"]
hopper = ["nvidia-cutlass-dsl>=4.6.2"]
dev = ["ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["wm"]

[tool.hatch.version]
path = "wm/__about__.py"

[tool.ruff]
target-version = "py311"
line-length = 88
# Vendored kernels keep their upstream style.
extend-exclude = ["wm/kernels/attention_jvp/cute_*.py", "wm/kernels/attention_jvp/triton*.py", "wm/codecs/_taehv/taehv.py"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I",
  "B",    # likely bugs (mutable defaults, loop-variable capture, zip without strict)
  "C4",   # comprehensions
  "PIE",
  "PLE", "PLW",
  "RET",
  "RUF",
  "SIM",
  "UP",
]
ignore = [
  "C408",  # dict(...) keyword calls are used for option tables
]

[tool.ruff.lint.per-file-ignores]
# Upstream Wan 2.2 VAE, kept close to the released implementation.
"wm/codecs/wan22.py" = ["B905", "RET", "RUF005", "RUF007", "RUF059", "SIM"]
